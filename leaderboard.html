<header class="hero"><div class="container"><h1>Community Builds</h1><p>Your saved projects, kept in this browser only. Nothing is uploaded.</p></div></header>
<section class="section container"><div class="card"><div id="builds">Loading&hellip;</div>
<div style="height:16px"></div>
<div style="display:flex;gap:12px;flex-wrap:wrap">
  <button class="btn ghost" id="btn-clear">Clear My List</button>
  <a class="btn" href="game.html">Find More Projects</a>
</div></div></section>
<script>
(function(){
  var el=document.getElementById('builds');
  var STORE='dc_build_list';
  function read(){try{var raw=JSON.parse(localStorage.getItem(STORE)||'[]');return Array.isArray(raw)?raw:[];}catch(e){return [];}}
  var list=read();
  if(!list.length){
    el.innerHTML='<h3>No saved projects yet</h3><p>Open the Project Ideas board and save the projects you want to build. Your list will appear here.</p>';
  }else{
    var rows=list.map(function(b,i){
      var when='';
      try{when=new Date(b.at).toLocaleString();}catch(e){when='';}
      return '<tr><td>#'+(i+1)+'</td><td>'+b.name+'</td><td>'+b.cat+'</td><td>'+b.time+'</td><td>'+when+'</td></tr>';
    }).join('');
    el.innerHTML='<h3>Saved projects ('+list.length+')</h3><table style="width:100%;margin-top:12px"><thead><tr><th>Rank</th><th>Project</th><th>Category</th><th>Time</th><th>Added</th></tr></thead><tbody>'+rows+'</tbody></table>';
  }
  var clear=document.getElementById('btn-clear');
  if(clear)clear.addEventListener('click',function(){
    try{localStorage.removeItem(STORE);}catch(e){}
    location.reload();
  });
})();
</script>
